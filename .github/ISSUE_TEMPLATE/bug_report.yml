name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, do not use this form — see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the HTTP status and `reason_code` / `detail` from the problem+json body if relevant.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. make distributed-up\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Deployment profile
      options: [mvp, hardened, distributed, kubernetes, tests only]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Commit SHA, OS, Go and Docker versions, relevant logs (redact tokens).
