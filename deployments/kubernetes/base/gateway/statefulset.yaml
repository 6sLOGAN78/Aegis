apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aegis-gateway
  namespace: aegis-system
  labels:
    app: aegis-gateway
spec:
  serviceName: aegis-gateway
  replicas: 3
  selector:
    matchLabels:
      app: aegis-gateway
  template:
    metadata:
      labels:
        app: aegis-gateway
    spec:
      # Drain budget: preStop 5 + propagation delay 10 + drain 30 + 10 (audit flush, metrics) = 55 <= 70.
      # Sidecar budget: the audit-worker preStop sleeps 55 (gateway worst case) so it gets SIGTERM only
      # after the gateway's last WAL write, then has up to 15s for its own shutdown (the drain test
      # requires at least 10s). Cost: the sleep does not end early, so each pod takes >= 55s to
      # terminate and a 3-replica rollout takes about 3 minutes.
      terminationGracePeriodSeconds: 70
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: aegis/gateway:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http-user
            - containerPort: 8443
              name: mtls-workload
            - containerPort: 9091
              name: metrics
          envFrom:
            - configMapRef:
                name: aegis-gateway-config
          env:
            # POD_NAME must be declared before the variables that use $(POD_NAME).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AEGIS_CP_CLIENT_CERT_PATH
              value: /etc/aegis/cp-client/cp-client-$(POD_NAME).crt
            - name: AEGIS_CP_CLIENT_KEY_PATH
              value: /etc/aegis/cp-client/cp-client-$(POD_NAME).key
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          startupProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
            failureThreshold: 1
          volumeMounts:
            - name: wal-spool
              mountPath: /var/log/aegis/wal
            - name: tmp
              mountPath: /tmp
            - name: workload-tls
              mountPath: /etc/aegis/tls
              readOnly: true
            - name: root-ca
              mountPath: /etc/aegis/ca
              readOnly: true
            - name: assertion-key
              mountPath: /etc/aegis/assertion
              readOnly: true
            - name: cp-clients
              mountPath: /etc/aegis/cp-client
              readOnly: true
            - name: jwt-keyset
              mountPath: /etc/aegis/keysets/jwt
              readOnly: true
            - name: snapshot-keyset
              mountPath: /etc/aegis/keysets/snapshot
              readOnly: true
        # Audit worker sidecar: drains the same PVC-backed WAL the gateway writes (D-23).
        - name: audit-worker
          image: aegis/audit-worker:latest
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 55"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: AEGIS_SPOOL_DIR
              value: /var/log/aegis/wal
            # Delete a segment once the cursor has moved past it; without this the PVC never shrinks.
            - name: AEGIS_PRUNE_ARCHIVED
              value: "true"
            - name: AEGIS_DB_HOST
              value: postgres.aegis-system
            - name: AEGIS_DB_PORT
              value: "5432"
            - name: AEGIS_DB_NAME
              value: aegis
            - name: AEGIS_DB_SSLMODE
              value: disable
            - name: AEGIS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: aegis-db-credentials
                  key: AEGIS_DB_USER
            - name: AEGIS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegis-db-credentials
                  key: AEGIS_DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: wal-spool
              mountPath: /var/log/aegis/wal
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: workload-tls
          secret:
            secretName: aegis-gateway-workload-tls
        - name: root-ca
          configMap:
            name: aegis-root-ca
        - name: assertion-key
          secret:
            secretName: aegis-gateway-assertion-key
        - name: cp-clients
          secret:
            secretName: aegis-gateway-cp-clients
        - name: jwt-keyset
          configMap:
            name: gateway-jwt-keyset
        - name: snapshot-keyset
          configMap:
            name: gateway-snapshot-keyset
  volumeClaimTemplates:
    - metadata:
        name: wal-spool
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
