apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-gateway-config
  namespace: aegis-system
  labels:
    app: aegis-gateway
data:
  AEGIS_PORT: "8080"
  AEGIS_WORKLOAD_PORT: "8443"
  AEGIS_METRICS_PORT: "9091"
  AEGIS_DRAIN_TIMEOUT: "30s"
  AEGIS_UPSTREAM_SCHEME: "https"
  AEGIS_ISSUER: "aegis-issuer"
  AEGIS_AUDIENCE: "aegis-gateway"
  AEGIS_SPOOL_DIR: "/var/log/aegis/wal"
  AEGIS_REDIS_ADDR: "redis.aegis-system:6379"
  AEGIS_CONTROL_PLANE_GRPC_ADDR: "aegis-control-plane.aegis-system:9090"
  AEGIS_CP_SERVER_NAME: "aegis-control-plane"
  AEGIS_CP_CA_PATH: "/etc/aegis/ca/root-ca.crt"
  AEGIS_JWT_KEYSET_DIR: "/etc/aegis/keysets/jwt"
  AEGIS_SNAPSHOT_KEYSET_DIR: "/etc/aegis/keysets/snapshot"
  AEGIS_KEYSET_RELOAD_INTERVAL: "10s"
  AEGIS_TLS_CERT_PATH: "/etc/aegis/tls/gateway-server.crt"
  AEGIS_TLS_KEY_PATH: "/etc/aegis/tls/gateway-server.key"
  AEGIS_CLIENT_CERT_PATH: "/etc/aegis/tls/gateway-client.crt"
  AEGIS_CLIENT_KEY_PATH: "/etc/aegis/tls/gateway-client.key"
  AEGIS_WORKLOAD_CA_PATH: "/etc/aegis/ca/root-ca.crt"
  AEGIS_ASSERTION_PRIVATE_KEY_PATH: "/etc/aegis/assertion/assertion-ed25519.key"
