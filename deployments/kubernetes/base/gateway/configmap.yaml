apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-gateway-config
  namespace: aegis-system
  labels:
    app: aegis-gateway
data:
  AEGIS_HTTP_ADDR: ":8080"
  AEGIS_WORKLOAD_ADDR: ":8443"
  AEGIS_METRICS_ADDR: ":9091"
  AEGIS_DRAIN_TIMEOUT: "30s"
  AEGIS_SPOOL_DIR: "/var/log/aegis/wal"
  AEGIS_REDIS_ADDR: "redis:6379"
  AEGIS_CONTROL_PLANE_GRPC_ADDR: "aegis-control-plane:9090"
