apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-control-plane
  namespace: aegis-system
  labels:
    app: aegis-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegis-control-plane
  template:
    metadata:
      labels:
        app: aegis-control-plane
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: aegis/control-plane:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8084
              name: http-mgmt
            - containerPort: 9090
              name: grpc-snapshot
            - containerPort: 9092
              name: metrics
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /livez
              port: 8084
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: 8084
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8084
            periodSeconds: 5
            failureThreshold: 1
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
