apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-control-plane
  namespace: aegis-system
  labels:
    app: aegis-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegis-control-plane
  template:
    metadata:
      labels:
        app: aegis-control-plane
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: aegis/control-plane:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8084
              name: http-mgmt
            - containerPort: 9090
              name: grpc-snapshot
            - containerPort: 9092
              name: metrics
          envFrom:
            - configMapRef:
                name: aegis-control-plane-config
          env:
            - name: AEGIS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: aegis-db-credentials
                  key: AEGIS_DB_USER
            - name: AEGIS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegis-db-credentials
                  key: AEGIS_DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /livez
              port: 8084
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: 8084
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8084
            periodSeconds: 5
            failureThreshold: 1
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: grpc-tls
              mountPath: /etc/aegis/tls
              readOnly: true
            - name: root-ca
              mountPath: /etc/aegis/ca
              readOnly: true
            - name: signing-key
              mountPath: /etc/aegis/signing
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: grpc-tls
          secret:
            secretName: aegis-control-plane-tls
        - name: root-ca
          configMap:
            name: aegis-root-ca
        - name: signing-key
          secret:
            secretName: aegis-control-plane-signing-key
