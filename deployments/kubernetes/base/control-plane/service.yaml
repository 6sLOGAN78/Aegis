apiVersion: v1
kind: Service
metadata:
  name: aegis-control-plane
  namespace: aegis-system
  labels:
    app: aegis-control-plane
spec:
  type: ClusterIP
  selector:
    app: aegis-control-plane
  ports:
    - name: http-mgmt
      port: 8084
      targetPort: 8084
      protocol: TCP
    - name: grpc-snapshot
      port: 9090
      targetPort: 9090
      protocol: TCP
    - name: metrics
      port: 9092
      targetPort: 9092
      protocol: TCP
