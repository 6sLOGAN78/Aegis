apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: aegis-apps
  labels:
    app: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin
          image: aegis/admin:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8083
              name: http-mtls
          env:
            - name: PORT
              value: "8083"
            - name: TLS_CERT_PATH
              value: /etc/aegis/tls/tls.crt
            - name: TLS_KEY_PATH
              value: /etc/aegis/tls/tls.key
            - name: CA_CERT_PATH
              value: /etc/aegis/ca/root-ca.crt
            - name: GATEWAY_ASSERTION_PUBKEY_PATH
              value: /etc/aegis/assertion/assertion-ed25519.pub
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # mTLS is mandatory, so httpGet probes cannot present a client cert.
          startupProbe:
            tcpSocket:
              port: 8083
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 8083
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8083
            periodSeconds: 5
            failureThreshold: 1
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /etc/aegis/tls
              readOnly: true
            - name: root-ca
              mountPath: /etc/aegis/ca
              readOnly: true
            - name: assertion-pubkey
              mountPath: /etc/aegis/assertion
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: tls
          secret:
            secretName: aegis-backend-admin-tls
        - name: root-ca
          configMap:
            name: aegis-root-ca
        - name: assertion-pubkey
          configMap:
            name: aegis-assertion-pubkey
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: aegis-apps
  labels:
    app: admin
spec:
  type: ClusterIP
  selector:
    app: admin
  ports:
    - name: http-mtls
      port: 8083
      targetPort: 8083
      protocol: TCP
