apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegis-audit-worker-networkpolicy
  namespace: aegis-system
spec:
  podSelector:
    matchLabels:
      app: aegis-audit-worker
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # Allow PostgreSQL database connection on :5432
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Mandatory CoreDNS egress on port 53 UDP/TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
