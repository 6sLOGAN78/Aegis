global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend aegis_http_front
    bind *:8080
    default_backend aegis_http_back

backend aegis_http_back
    balance roundrobin
    option httpchk GET /readyz
    http-check expect status 200
    default-server inter 1s fall 2 rise 2
    server gateway-1 gateway-1:8080 check
    server gateway-2 gateway-2:8080 check
    server gateway-3 gateway-3:8080 check

frontend aegis_workload_front
    bind *:9443
    mode tcp
    default_backend aegis_workload_back

backend aegis_workload_back
    mode tcp
    balance roundrobin
    default-server inter 1s fall 2 rise 2
    server gateway-1 gateway-1:9443 check
    server gateway-2 gateway-2:9443 check
    server gateway-3 gateway-3:9443 check

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
